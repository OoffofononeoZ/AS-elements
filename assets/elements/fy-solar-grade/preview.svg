<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0703"/>
      <stop offset="38%" stop-color="#7a2510"/>
      <stop offset="66%" stop-color="#ff7a1f"/>
      <stop offset="100%" stop-color="#ffe3a0"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04101c"/>
      <stop offset="55%" stop-color="#0c3a5a"/>
      <stop offset="100%" stop-color="#6fe6ff"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="#02030a"/>
  <g filter="url(#blur)" opacity="0.92">
    <path d="M0 180 L0 92 C52 70 96 108 148 76 C198 46 242 78 320 34 L320 180 Z" fill="url(#warm)"/>
    <path d="M0 0 L0 62 C62 44 92 86 154 58 C214 30 258 54 320 12 L320 0 Z" fill="url(#cool)"/>
  </g>
  <rect x="0" y="0" width="320" height="180" fill="url(#warm)" opacity="0.18"/>
  <rect x="0" y="0" width="320" height="180" fill="url(#cool)" opacity="0.14"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-14 180 C52 116 96 142 160 92 C222 44 262 72 336 -6" stroke="#ff3b18" stroke-width="7" opacity="0.28" filter="url(#blur)"/>
    <path d="M-14 180 C52 116 96 142 160 92 C222 44 262 72 336 -6" stroke="#ffb15a" stroke-width="2.2" opacity="0.75"/>
    <path d="M-14 180 C52 116 96 142 160 92 C222 44 262 72 336 -6" stroke="#8fe9ff" stroke-width="1" opacity="0.55" transform="translate(3,-2)"/>
    <path d="M-14 180 C52 116 96 142 160 92 C222 44 262 72 336 -6" stroke="#ff4f8b" stroke-width="0.8" opacity="0.5" transform="translate(-3,2)"/>
  </g>
  <g fill="#fff2cf" opacity="0.18">
    <circle cx="64" cy="120" r="22"/><circle cx="196" cy="78" r="28"/><circle cx="276" cy="44" r="18"/>
  </g>
  <rect width="320" height="180" fill="url(#vig)"/>
  <rect width="320" height="180" filter="url(#grain)" opacity="0.55"/>
</svg>
