interface:
    display_name: 'Visualizer Content Generator'
    short_description: '自主生成外部 V2 元素和仅组合已有元素的预设，交付实际展示图，必要信息不足时再询问'
    default_prompt: 'Use $visualizer-content-generator v2.4.0 to design, generate and validate external V2 resources without a mandatory content approval step. Decide open creative details autonomously and ask only about blocking gaps in explicit requirements. Deliver at least one actual preview image per resource. Create and validate missing elements before composing a preset. Preserve ABI 1/2 and user-bound marker access boundaries.'
policy:
    allow_implicit_invocation: true
